<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <defs>
    <!-- 3D Gradients & Filters -->
    <filter id="glow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#ec4899" flood-opacity="0.35"/>
    </filter>
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <linearGradient id="silverFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="silverSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="pinkFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="pinkSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <g transform="translate(45, 10)">
    <!-- 3D Shadow Cast Layers for A 2 Z -->
    <!-- Letter A Shadow -->
    <path d="M 85,15 L 145,115 L 115,115 L 102,90 L 48,90 L 35,115 L 5,115 L 65,15 Z M 75,40 L 56,76 L 94,76 Z" 
          fill="#0f172a" opacity="0.6" transform="translate(6, 8)" />

    <!-- Letter A Side Return (3D depth) -->
    <path d="M 65,15 L 71,23 L 151,123 L 145,115 L 102,90 L 106,96 L 115,115 Z" fill="url(#silverSide)" />
    
    <!-- Letter A Front Face -->
    <path d="M 75,15 L 138,115 L 110,115 L 98,90 L 50,90 L 38,115 L 10,115 L 73,15 Z M 74,42 L 57,75 L 91,75 Z" 
          fill="url(#silverFace)" stroke="#ffffff" stroke-width="2" filter="url(#whiteGlow)" />

    <!-- Number 2 3D Shadow -->
    <path d="M 175,15 C 235,15 255,45 235,70 L 195,100 L 255,100 L 255,115 L 165,115 L 165,95 L 210,65 C 225,50 215,30 185,30 C 170,30 160,35 155,42 L 140,28 C 150,18 162,15 175,15 Z" 
          fill="#000000" opacity="0.6" transform="translate(6, 8)" />

    <!-- Number 2 Side Depth -->
    <path d="M 235,70 L 241,78 L 201,108 L 261,108 L 255,100 Z" fill="url(#pinkSide)" />

    <!-- Number 2 Front Face (Signature Vibrant Magenta/Pink) -->
    <path d="M 180,15 C 232,15 252,42 232,68 L 192,98 L 252,98 L 252,115 L 162,115 L 162,95 L 208,63 C 222,48 214,32 186,32 C 170,32 160,38 154,45 L 138,30 C 148,18 163,15 180,15 Z" 
          fill="url(#pinkFace)" stroke="#fda4af" stroke-width="2.5" filter="url(#glow3d)" />

    <!-- Letter Z 3D Shadow -->
    <path d="M 275,15 L 375,15 L 375,32 L 315,98 L 378,98 L 378,115 L 275,115 L 275,98 L 335,32 L 275,32 Z" 
          fill="#0f172a" opacity="0.6" transform="translate(6, 8)" />

    <!-- Letter Z Side Return -->
    <path d="M 375,15 L 381,23 L 381,40 L 321,106 L 384,106 L 378,98 Z" fill="url(#silverSide)" />

    <!-- Letter Z Front Face -->
    <path d="M 280,15 L 375,15 L 375,32 L 318,98 L 378,98 L 378,115 L 280,115 L 280,98 L 338,32 L 280,32 Z" 
          fill="url(#silverFace)" stroke="#ffffff" stroke-width="2" filter="url(#whiteGlow)" />

    <!-- Word "S I G N S" underneath -->
    <g transform="translate(10, 138)" filter="url(#whiteGlow)">
      <!-- Letter S -->
      <path d="M 12,5 C 28,5 34,12 34,20 C 34,28 26,32 16,35 C 8,37 6,40 6,43 C 6,48 12,52 24,52 C 32,52 38,48 40,44 L 46,50 C 42,57 34,61 22,61 C 8,61 0,53 0,42 C 0,32 8,27 18,24 C 26,22 28,19 28,16 C 28,11 22,8 14,8 C 8,8 4,11 2,14 L -4,8 C 0,2 6,5 12,5 Z" fill="url(#silverFace)" />
      
      <!-- Letter I -->
      <path d="M 85,5 L 95,5 L 95,59 L 85,59 Z" fill="url(#silverFace)" />

      <!-- Letter G -->
      <path d="M 160,5 C 180,5 190,18 190,33 L 190,59 L 165,59 L 165,37 L 180,37 L 180,33 C 180,22 172,13 160,13 C 146,13 138,23 138,33 C 138,43 146,51 160,51 C 166,51 171,49 175,46 L 180,52 C 174,57 167,61 158,61 C 140,61 128,48 128,33 C 128,17 140,5 160,5 Z" fill="url(#silverFace)" />

      <!-- Letter N -->
      <path d="M 230,5 L 240,5 L 268,45 L 268,5 L 278,5 L 278,59 L 268,59 L 240,19 L 240,59 L 230,59 Z" fill="url(#silverFace)" />

      <!-- Letter S -->
      <path d="M 330,5 C 346,5 352,12 352,20 C 352,28 344,32 334,35 C 326,37 324,40 324,43 C 324,48 330,52 342,52 C 350,52 356,48 358,44 L 364,50 C 360,57 352,61 340,61 C 326,61 318,53 318,42 C 318,32 326,27 336,24 C 344,22 346,19 346,16 C 346,11 340,8 332,8 C 326,8 322,11 320,14 L 314,8 C 318,2 324,5 330,5 Z" fill="url(#silverFace)" />
    </g>
  </g>
</svg>
